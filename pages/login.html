<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Botica Belén</title>
  <link rel="icon" type="image/png" href="../img/Botica_belen.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/wcag.css?v=2.2.0">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="bg-light">

  <main class="container my-5" style="max-width: 440px;">
    <div class="card p-4 shadow-sm border-0 rounded-4">
      <div class="text-center mb-3">
        <img src="../img/Botica_belen.png" alt="Logo de Botica Belén" style="max-height: 80px; object-fit: contain;">
      </div>
      <h1 class="h4 text-center fw-bold mb-1 text-primary">Botica Belén</h1>
      <p class="text-center text-muted small mb-4">Sistema de Gestión e Inventario Farmacéutico</p>

      <div id="login-alerta" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

      <form id="task-form" novalidate>
        <div class="mb-3">
          <label for="login-correo" class="form-label fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="email" id="login-correo" class="form-control" required placeholder="usuario@boticabelen.com" autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="login-pass" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="login-pass" class="form-control" required placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
        </button>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/components/wcag-accessibility.js"></script>
  <script type="module" src="../js/js/auth.js?v=2.3.4"></script>
</body>
</html>
