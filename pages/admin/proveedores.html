<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directorio de Proveedores | Botica Belén</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/admin.css" rel="stylesheet">
</head>
<body>
  <header id="admin-header" class="admin-header"></header>

  <div class="admin-shell">
    <aside id="admin-sidebar" class="admin-sidebar" aria-label="Menú lateral"></aside>

    <main class="admin-content">
      <div class="page-head">
        <h1 class="page-title">Directorio de Proveedores</h1>
      </div>

      <div id="alerta" class="d-none" role="alert"></div>

      <section class="row g-3 mb-3" aria-label="Resumen de proveedores">
        <div class="col-md-4">
          <article class="kpi-card">
            <div>
              <div class="kpi-label">Total proveedores</div>
              <div class="kpi-value" id="kpi-total">0</div>
            </div>
            <span class="kpi-icon" aria-hidden="true"><i class="bi bi-people-fill"></i></span>
          </article>
        </div>

        <div class="col-md-4">
          <article class="kpi-card kpi-card-activos">
            <div>
              <div class="kpi-label">Proveedores activos</div>
              <div class="kpi-value" id="kpi-activos">0</div>
            </div>
            <span class="kpi-icon" aria-hidden="true"><i class="bi bi-check-circle-fill"></i></span>
          </article>
        </div>

        <div class="col-md-4">
          <article class="kpi-card kpi-card-inactivos">
            <div>
              <div class="kpi-label">Proveedores inactivos</div>
              <div class="kpi-value" id="kpi-inactivos">0</div>
            </div>
            <span class="kpi-icon" aria-hidden="true"><i class="bi bi-slash-circle-fill"></i></span>
          </article>
        </div>
      </section>

      <section class="panel filters-panel mb-3" aria-labelledby="titulo-filtros">
        <div class="panel-head">
          <h2 class="panel-title" id="titulo-filtros">Filtrar búsqueda</h2>
          <a href="proveedor-formulario.html" class="btn btn-brand">
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i> Nuevo Proveedor
          </a>
        </div>

        <form id="form-filtros" class="row g-3 align-items-end" role="search">
          <div class="col-lg-5 col-md-12">
            <label for="filtro-texto" class="form-label">RUC o Nombre de proveedor</label>
            <input type="search" class="form-control" id="filtro-texto"
                   placeholder="Ej. 20123456789 o DISTR. FARMA SAC"
                   autocomplete="off">
          </div>

          <div class="col-lg-3 col-md-4">
            <label for="filtro-categoria" class="form-label">Categoría</label>
            <select class="form-select" id="filtro-categoria">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="col-lg-2 col-md-4">
            <label for="filtro-estado" class="form-label">Estado</label>
            <select class="form-select" id="filtro-estado">
              <option value="">Todos</option>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>

          <div class="col-lg-2 col-md-4 filters-actions">
            <button type="submit" class="btn btn-dark btn-buscar w-100">
              <i class="bi bi-search me-1" aria-hidden="true"></i> Buscar
            </button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="titulo-listado">
        <div class="panel-head">
          <h2 class="panel-title" id="titulo-listado">Listado de Proveedores</h2>
          <p class="panel-subtitle mb-0" id="resumen-listado" aria-live="polite"></p>
        </div>

        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">RUC</th>
                <th scope="col">Razón Social</th>
                <th scope="col">Contacto</th>
                <th scope="col">Teléfono</th>
                <th scope="col">Correo</th>
                <th scope="col">Categoría</th>
                <th scope="col">Estado</th>
                <th scope="col" class="cell-actions">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-proveedores">
              <tr>
                <td colspan="8" class="table-empty">
                  <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                  Cargando proveedores…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <noscript>
        <div class="alert alert-warning mt-3">
          Este módulo necesita JavaScript habilitado para consultar Firestore.
        </div>
      </noscript>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js/js/proveedores-lista.js"></script>
</body>
</html>
